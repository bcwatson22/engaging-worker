name: CI

on:
  push:
  pull_request:

# Nothing here needs write access. The deploy job, when it lands, will ask for
# what it needs rather than inheriting it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Tracks go.mod, so CI cannot drift from the Dockerfile.
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # v7 or later is required for golangci-lint v2, and v9 runs on Node 24
      # rather than the Node 20 the runner now warns about. The linter version
      # is pinned rather than tracking latest, for the same reason the sibling
      # repos pin oxlint: a release that adds a check should fail on the PR
      # that bumps it, not on an unrelated one.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      # A stray dependency or a hand-edited go.mod shows up here rather than as
      # a mystery build failure later.
      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      # -race because Phase 2 gives this worker goroutines, and a data race
      # found the week it is introduced is a different problem from one found
      # in a render that failed at three in the morning.
      #
      # Coverage over internal/ only: cmd/worker is a composition root with
      # nothing to assert, and including it reports a number that does not
      # match the badge.
      #
      # The render tests drive the Chrome the runner already carries. They skip
      # rather than fail without one, so the coverage floor below is what
      # proves they actually ran.
      - name: Test
        run: go test -race ./internal/... -coverprofile=cover.out

      # Go has no built-in threshold, so this is the equivalent of the 100%
      # gates in the sibling repos — and set to the same number, because the
      # render logic sits behind an interface and every branch of it is
      # reachable without a browser that has agreed to fail.
      - name: Coverage
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 100) }' || {
            echo "::error::coverage ${total}% is below 100%"
            exit 1
          }

      # Runs with no secrets in scope, so tracking the newest scanner is the
      # right trade here — unlike the deploy action below, which is pinned.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: go build ./...

  image:
    # Only on pull requests. `flyctl deploy` builds the image itself, so on
    # main this would build the same Dockerfile twice; the value here is
    # catching a broken build before merge, not after.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # The deployed artifact is the image, not the binary `go build` produces.
      # This one installs Chromium and its fonts, which is most of what can
      # break and none of what the Go toolchain checks.
      - run: docker build -t engaging-worker .

  deploy:
    # Depends on `verify` alone, deliberately. A skipped job counts as unmet in
    # GitHub Actions, so needing `image` — which is skipped on main — would
    # skip this too and nothing would ever deploy. Nothing is lost: the deploy
    # builds the same Dockerfile, so a broken image fails the deploy rather
    # than shipping past it.
    needs: [verify]
    # The workflow triggers on every push and every pull request, so without
    # this a branch push would deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Deploys queue rather than race. Not cancel-in-progress: interrupting a
    # half-finished deploy leaves the app in a worse state than waiting does.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit rather than @master, which is what Fly's own docs
      # suggest: this step runs with a deploy token in scope, so it should not
      # be whatever was pushed to their default branch this morning.
      # ed8efb3 is tags 1.6 and v1 as of 2026-08-17.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Built on Fly's builders rather than this runner, so the image is
      # produced next to where it is deployed.
      #
      # A deploy replaces the machine. Nothing waits on this service — a render
      # interrupted mid-flight stays unacked and is reclaimed by XAUTOCLAIM on
      # the next wake, which is the case the queue exists to handle.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
